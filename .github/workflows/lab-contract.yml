name: Lab contract validation

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate qualification documentation
        run: python3 scripts/validate_lab.py

# This checks lab documentation only, not Astro/Payload runtime or E2E.
